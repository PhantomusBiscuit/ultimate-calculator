<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultimate Calculator &ndash; Manual</title>

  <link rel="stylesheet" href="assets/style.css">
  <script>!('uc'in window)?window.uc=Object.assign(Object.create(null),{isNull:true}):0</script>
  <script src="libs/module.js" type="module"></script>
</head>
<body>
  <header class="global-actions">
    <button class="btn-transparent close" title="Close" onclick="uc.close()"><i class="mdi-window-close"></i></button>
    <button class="btn-transparent maximize" title="Maximize" onclick="uc.toggleMaximize()"><i class="mdi-window-maximize"></i></button>
    <button class="btn-transparent minimize" title="Minimize" onclick="uc.minimize()"><i class="mdi-minus"></i></button>
    <i style="width: 8px;"></i>
    <button class="btn-transparent keep-above" title="Keep this window above others"><i class="mdi-chevron-up"></i></button>
    <span class="title">Ultimate Calculator &ndash; Manual</span>
    <div class="menus"></div>
    <img id="app-favicon" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3C/svg%3E" alt="TuneFlow">
  </header>
  <main>
    <div class="loading"><i class="mdi mdi-loading mdi-spin"></i> Loading&mldr;</div>
  </main>
</body>
<scripts>
  <script type="module"></script>
</scripts>
</html>
