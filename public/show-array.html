<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultimate Calculator &ndash; Result array</title>

  <link rel="stylesheet" href="assets/style.css">

  <script type="module" src="./libs/math-import.js"></script>
  <script>!('api'in window)?window.api=Object.assign(Object.create(null),{isNull:true}):0</script>

  <script src="./libs/module.js" type="module"></script>
  <style>
    main { grid-template-rows: auto 1fr; }
    .output-array {
      display: grid; font-family: var(--font-mono);
      font-size: 1.25rem; overflow: auto;
      .item {
        display: grid; grid-template-columns: auto 1fr;
        .number {
          display: inline-flex;
          font-size: 50%; color: hsl(from var(--text) h s l / 0.75);
          width: 6ch; text-align: end;
          vertical-align: middle; height: 29px;
          margin-right: 0.5em; justify-content: end; align-items: center;
        }
      }
      .array { display: inline-block; }
    }
  </style>
</head>
<body>
  <header class="global-actions">
    <button class="btn-transparent close" title="Close" onclick="window.close()"><i class="mdi-window-close"></i></button>
    <span class="title">Ultimate Calculator &ndash; Result array</span>
    <img id="app-favicon" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3C/svg%3E" alt="TuneFlow">
  </header>
  <main>
    <div class="output-array"></div>
    <div class="loading"><i class="mdi mdi-loading mdi-spin"></i> Loading&mldr;</div>
  </main>
</body>
<scripts>
  <script type="module">
    import { $, $n, Compressor, m } from "./libs/module.js";
    async function main() {
      let c = new Compressor({ format: 'gzip', output: 'base64' });
      let array = await c.decompressText(new URLSearchParams(location.search).get('array'));
      array = math.parse(array);

      const outputArray = $('.output-array');
      function create(el, arr) {
        let addedHTML = '<div class="array">';
        addedHTML += '<calc-op>[</calc-op>';
        arr.items.forEach((a, i) => {
          const outputItem = $n('span');
          let output = a;
          outputItem.className = 'item';
          outputItem.innerHTML = '<span class="number">'+i+'</span>';
          outputItem.innerHTML += output.isArrayNode ? create(outputItem, output) : m.format(output);
          addedHTML += outputItem.outerHTML;
        });
        addedHTML += '<calc-op>]</calc-op>';
        addedHTML += '</div>';
        el.innerHTML += addedHTML;
        return addedHTML;
      };
      create(outputArray, array);
    }
    main()
  </script>
</scripts>
</html>
