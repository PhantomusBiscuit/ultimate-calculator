  <script src="./public/libs/highlight.js"></script>
  <script type="module">
    import showdown from './public/libs/showdown+esm.js';
    const converter = new showdown.Converter({
      ghCompatibleHeaderId: true,
      parseImgDimensions: true,
      simplifiedAutoLink: true,
      excludeTrailingPunctuationFromURLs: true,
      tasklists: true,
      tables: true,
      strikethrough: true,
      emoji: true,
      openLinksInNewWindow: true,
      backslashEscapesHTMLTags: true,
    });
    let res = await fetch('./README.md');
    document.querySelector('main').innerHTML = converter.makeHtml(await res.text());
    document.querySelectorAll('pre > code').forEach(item => {
      item.parentElement.setAttribute('data-language', item.classList[0]);
      item.outerHTML = hljs.highlight(item.textContent, { language: item.classList[0], }).value;
    });
    window.load = async (path) => {
      if (!['./README.md', './LICENSE.md', './THIRD_PARTY_NOTICES.md'].includes(path))
        throw new TypeError('Specified path cannot be accessed.');

      let res = await fetch(path);
      document.querySelector('main').innerHTML = converter.makeHtml(await res.text());
      document.querySelectorAll('pre > code').forEach(item => {
        item.parentElement.setAttribute('data-language', item.classList[0]);
        item.outerHTML = hljs.highlight(item.textContent, { language: item.classList[0], }).value;
      });
    };
    Object.defineProperty(window, 'load', {
      configurable: false, enumerable: false, writable: false
    });
  </script>
